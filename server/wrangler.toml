name = "formiq-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Model used by the coach. Change it here if you want a different one.
MODEL = "claude-opus-5-5"

# Secrets (never write them in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_KEY      (same value as appKey in www/config.js)
